<h2 class="sr-only">材料・製造・在庫・注文の主要テーブルとリレーションを示すER図(改訂版)</h2>
<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const def = `erDiagram
  MATERIAL ||--o{ MATERIAL_PACKAGE_SPEC : "梱包仕様を持つ"
  MATERIAL ||--o{ MATERIAL_ORDER : "発注対象"
  MATERIAL ||--o{ MATERIAL_LOT : "ロットを持つ"
  MATERIAL ||--o{ RECIPE_ITEM : "レシピで使用"
  MATERIAL_ORDER ||--o{ MATERIAL_ARRIVAL : "入荷が紐づく"
  MATERIAL_ARRIVAL ||--o{ MATERIAL_LOT : "合格分がロット化(1対多)"
  MATERIAL_ARRIVAL ||--o{ HOLD_RESOLUTION : "保留を対応"
  HOLD_RESOLUTION }o--o| MATERIAL_ARRIVAL : "交換品入荷を参照"
  MATERIAL_LOT ||--o{ STOCK_ADJUSTMENT : "手動調整される"
  PRODUCT ||--o{ RECIPE_ITEM : "レシピを持つ"
  PRODUCT ||--o{ MANUFACTURING_BATCH : "製造される"
  MANUFACTURING_BATCH ||--o{ BATCH_MATERIAL_USAGE : "材料を消費"
  MATERIAL_LOT ||--o{ BATCH_MATERIAL_USAGE : "使用/廃棄される"
  CUSTOMER_ORDER ||--o{ ORDER_LINE : "明細を持つ"
  ORDER_LINE ||--o{ SHIPMENT : "出荷される"
  MANUFACTURING_BATCH ||--o{ SHIPMENT : "出荷元ロット"

  MATERIAL {
    string material_id PK
    string name
    string category "RAW or ADDITIVE"
    string base_unit "WEIGHT or VOLUME"
    bool is_main_material
  }
  MATERIAL_PACKAGE_SPEC {
    string spec_id PK
    string material_id FK
    string origin
    number package_weight "1箱/袋の目安数量"
    string package_unit_label "箱/袋/缶など"
  }
  MATERIAL_ORDER {
    string order_id PK
    string material_id FK
    string supplier_id
    number order_qty
    date order_date
    date expected_date
    string status "未入荷/一部入荷/入荷完了"
  }
  MATERIAL_ARRIVAL {
    string arrival_id PK
    string order_id FK "任意"
    string supplier_lot_no
    string origin
    date expiry_date
    number package_count
    number package_weight_snapshot
    number arrived_qty
    number accepted_qty
    number held_qty
    bool check_damage
    bool check_expiry
    bool check_contamination
    string exchange_source_id FK "任意"
  }
  HOLD_RESOLUTION {
    string hold_id PK
    string arrival_id FK
    string resolution_type "RETURNED/EXCHANGED/ACCEPTED_LATE"
    string resolved_arrival_id FK "任意"
    string status "ON_HOLD/RESOLVED"
    string comment
  }
  MATERIAL_LOT {
    string lot_id PK
    string material_id FK
    string arrival_id FK
    string origin
    date expiry_date
    number remaining_qty
  }
  STOCK_ADJUSTMENT {
    string adjustment_id PK
    string lot_id FK
    number before_qty
    number after_qty
    date adjustment_date
    string comment
  }
  PRODUCT {
    string product_id PK
    string name
    number safety_stock_qty
    number target_stock_qty
  }
  RECIPE_ITEM {
    string recipe_item_id PK
    string product_id FK
    string material_id FK
    number use_qty
    string allowed_origins
    bool is_main_material
    bool is_liquid
  }
  MANUFACTURING_BATCH {
    string batch_id PK
    string product_id FK
    date batch_date
    number batch_seq
    string status "DRAFT/PLAN/MANUFACTURING/COMPLETED/REJECTED"
    number produced_qty
    number accepted_qty
    number loss_qty
    string loss_comment
    string reject_comment
  }
  BATCH_MATERIAL_USAGE {
    string usage_id PK
    string batch_id FK
    string material_lot_id FK
    number used_qty
    string usage_type "CONSUMPTION/DISPOSAL"
    string comment
  }
  CUSTOMER_ORDER {
    string order_id PK
    string customer_name
    date order_date
    string status
  }
  ORDER_LINE {
    string line_id PK
    string order_id FK
    string product_id FK
    number qty
  }
  SHIPMENT {
    string shipment_id PK
    string line_id FK
    string batch_id FK
    number shipped_qty
    date shipped_date
  }`;
const { svg } = await mermaid.render('erd-svg', def);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
