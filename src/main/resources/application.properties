# MySQL Workbench 8.0 CE への接続設定
# username / password は各自の環境に合わせて書き換えてください
spring.datasource.url=jdbc:mysql://localhost:3306/food_factory_dx?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=utf8mb4
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate設定
# ddl-auto=validate : テーブル構造はsql/phase0_master_schema.sqlで手動管理し、
#                      アプリ起動時にEntityとテーブル定義が一致しているかだけ検証する
# 開発初期でEntityを試行錯誤したい場合は一時的に update に変えてもよいが、
# 本プロジェクトは監査要件上、スキーマ変更を都度SQLファイルに残す運用を推奨する
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# サーバーポート(必要に応じて変更可)
server.port=8080

# 文字化け防止
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
