# MySQL Workbench 8.0 CE への接続設定
# username / password は各自の環境に合わせて書き換えてください
# (allowPublicKeyRetrieval=true は、MySQL8.0のデフォルト認証方式が
#  暗号化用の鍵をやり取りする際に必要な設定。開発中のローカル接続用の割り切り)
spring.datasource.url=jdbc:mysql://localhost:3306/food_factory_dx?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- MyBatisの設定 ----
# mapper-locations: 実際のSQLを書いたXMLファイルがどこにあるか。
#   classpath*:/mybatis/**/*.xml は「resources/mybatis フォルダ以下の、
#   どんな深さのフォルダに置かれた .xml ファイルでも全部読み込む」という意味。
mybatis.mapper-locations=classpath*:/mybatis/**/*.xml

# map-underscore-to-camel-case: DBの列名(is_main_material)とJavaのフィールド名(mainMaterial)を
#   自動的に対応付けてくれる設定。これがtrueだと、resultMapを書かなくても
#   多くの場合は自動でマッピングされる(ただし今回は列挙型の変換などを明示するため、
#   resultMapも合わせて書いている)。
mybatis.configuration.map-underscore-to-camel-case=true

# type-aliases-package: Mapperインターフェースの中で「Material」のように短い名前だけでも
#   クラスを参照できるようにするための設定(このパッケージ内を自動的に探してくれる)。
#   今回は完全なパッケージ名(com.foodfactory.dx.domain.Material)で明示的に書いているため
#   必須ではないが、将来的にコードを簡潔にしたくなった際のために設定しておく。
mybatis.type-aliases-package=com.foodfactory.dx.domain

# 実行されたSQLをログに出す設定。動作確認中は表示しておくと、
# 「意図した通りのSQLが実行されているか」を目で確認できて安心。
logging.level.com.foodfactory.dx.mapper=DEBUG

# サーバーポート(必要に応じて変更可)
server.port=8080

# 文字化け防止
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
